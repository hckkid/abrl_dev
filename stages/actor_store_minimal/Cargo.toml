[package]
name = "actor_store_minimal"
version = "0.1.0"
edition = "2024"

[dependencies]
dashmap = "7.0.0-rc2"
serde_json = "1.0.145"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
bincode = "1.3"
uuid = { version = "1", features = ["v4", "serde"] }